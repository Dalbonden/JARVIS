[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS: a personal AI voice assistant built on the Claude API"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
jarvis = "jarvis.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
